[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-labs"
version = "0.1.0"
description = "AI workflows, usage measurement and evaluation reference implementations"
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
meridian-labs = "workflow_portfolio.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"workflow_portfolio.usage" = ["*.json"]
