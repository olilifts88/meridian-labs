[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workflow-portfolio"
version = "0.1.0"
description = "Fictional, source-backed AI workflow operations reference"
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
ai-workflow = "workflow_portfolio.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
