name: checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python workflows and evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/capability_check.py
      - run: python demo.py evaluate
      - run: python -m workflow_portfolio demo
      - run: python -m workflow_portfolio benchmark
      - run: python -m workflow_portfolio journey examples/release_journey.json
      - run: python -m workflow_portfolio candidate-review-demo
      - run: python -m workflow_portfolio.usage.demo

  browser:
    name: Browser and workflow checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run n8n:check
      - run: npm run test:web
      - run: node scripts/preview-candidates.mjs examples/release_journey.json
      - run: node scripts/preview-review-action.mjs examples/candidate_review_action.json
      - run: node --test tests/calibration-feedback.test.cjs

  package:
    name: Offline download verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm run test:download

  # Preserve the original checks/test status for existing required-check rules.
  test:
    if: ${{ always() }}
    needs: [python, browser, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check group to pass
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$PACKAGE_RESULT" = success
