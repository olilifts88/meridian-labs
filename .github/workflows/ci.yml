name: checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m workflow_portfolio demo
      - run: python -m workflow_portfolio benchmark
      - run: python -m workflow_portfolio journey examples/release_journey.json
      - run: python -m workflow_portfolio candidate-review-demo
      - run: npm run n8n:check
      - run: npm run test:n8n
      - run: node scripts/preview-candidates.mjs examples/release_journey.json
      - run: node scripts/preview-review-action.mjs examples/candidate_review_action.json
      - run: node --test tests/calibration-feedback.test.cjs
      - run: python -m workflow_portfolio.usage.demo
