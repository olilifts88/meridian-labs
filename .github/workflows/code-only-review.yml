name: Code-only portfolio demos (offline)

on:
  workflow_dispatch:
    inputs:
      case:
        description: Fictional case to review
        required: true
        type: choice
        options:
          - beta_csv_bad
          - beta_csv_good
          - new_guide
          - release_candidates
          - release_journey
          - candidate_review

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run saved case without n8n or external writes
        env:
          CASE_ID: ${{ inputs.case }}
        run: |
          case "$CASE_ID" in
            release_candidates)
              node scripts/preview-candidates.mjs examples/release_candidates.json
              ;;
            release_journey)
              node scripts/preview-candidates.mjs examples/release_journey.json
              python -m workflow_portfolio journey examples/release_journey.json
              ;;
            candidate_review)
              node scripts/preview-review-action.mjs examples/candidate_review_action.json
              python -m workflow_portfolio candidate-review-demo
              ;;
            beta_csv_bad|beta_csv_good|new_guide)
              python -m workflow_portfolio submit "examples/$CASE_ID.json" --db "$RUNNER_TEMP/meridian-labs.sqlite3"
              python -m workflow_portfolio report --db "$RUNNER_TEMP/meridian-labs.sqlite3"
              ;;
            *) echo "Unsupported case" >&2; exit 2 ;;
          esac
